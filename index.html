<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTD Muslim Org Calendar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: org roster strip on top, month grid as the centerpiece, agenda list below; filters drive both. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#18241f; --muted:#5d6b64; --line:#d9e0da;
  --accent:#1f5b4a; --accent-soft:#e2ede7; --gold:#b98a2e; --gold-soft:#f6ecd6; --today:#b98a2e;
  --c-faith:#1f5b4a; --c-service:#2f6f9f; --c-pro:#7a4fa3; --c-culture:#b5532f; --c-advocacy:#8a3b3b; --c-greek:#3d6b2f; --c-community:#a3782a; --c-academic:#59636b;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111815; --surface:#18211d; --ink:#e7eee9; --muted:#9aaaa2; --line:#2a3631;
  --accent:#7cc3a6; --accent-soft:#1f2f28; --gold:#e0b45a; --gold-soft:#2f2717; --today:#e0b45a;
  --c-faith:#7cc3a6; --c-service:#7fb4dc; --c-pro:#bb9ae0; --c-culture:#e8916c; --c-advocacy:#df8b8b; --c-greek:#9cc98a; --c-community:#e0b45a; --c-academic:#a9b3ba;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111815; --surface:#18211d; --ink:#e7eee9; --muted:#9aaaa2; --line:#2a3631;
  --accent:#7cc3a6; --accent-soft:#1f2f28; --gold:#e0b45a; --gold-soft:#2f2717; --today:#e0b45a;
  --c-faith:#7cc3a6; --c-service:#7fb4dc; --c-pro:#bb9ae0; --c-culture:#e8916c; --c-advocacy:#df8b8b; --c-greek:#9cc98a; --c-community:#e0b45a; --c-academic:#a9b3ba;
  color-scheme:dark}
*{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.4vw,44px);line-height:1.1;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px}
.meta{color:var(--muted);font-size:13px;max-width:52ch}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sechead p{margin:0;color:var(--muted);font-size:13px}

/* org roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.org{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.org:hover{border-color:var(--accent)}
.org:focus-visible,.chip:focus-visible,.ev:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.org[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.org.dim{opacity:.55}
.logo{width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;background:var(--accent-soft);border:2px solid var(--cat,var(--line));display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--cat)}
.org .txt{min-width:0;display:flex;flex-direction:column}
.org .nm{font-weight:600;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.org .hd{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.org .ct{font-family:var(--mono);font-size:11px;color:var(--accent)}
.groups{display:flex;flex-direction:column;gap:18px}
.grp h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600;display:flex;align-items:center;gap:8px}
.grp h3 i{width:10px;height:10px;border-radius:50%;background:var(--cat);display:inline-block}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.filters .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}

/* month grid */
.cal{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:8px 10px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.day{min-height:128px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day:nth-child(7n){border-right:none}
.day.out{background:var(--bg)}
.day.past .n{color:var(--muted)}
.day .n{font-family:var(--mono);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.day.today .n b{background:var(--today);color:var(--bg);border-radius:6px;padding:0 6px}
.day.brk{background:var(--gold-soft)}
.brklbl{font-size:11px;color:var(--gold);font-weight:600}
.ev{display:flex;gap:6px;align-items:flex-start;text-align:left;width:100%;border:none;background:color-mix(in srgb,var(--cat) 12%,var(--surface));border-left:3px solid var(--cat);border-radius:5px;padding:3px 5px;font:inherit;font-size:12px;line-height:1.25;color:var(--ink);cursor:pointer;min-width:0}
.ev img,.ev .mini{width:16px;height:16px;border-radius:50%;flex:none;object-fit:cover;margin-top:1px}
.ev span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ev .t{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block}
.ev.flag{border-left-style:dashed}

/* agenda */
.agenda{display:flex;flex-direction:column;gap:22px}
.aday h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
.aday h3 em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:110px 40px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.row .tm{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:8px;font-variant-numeric:tabular-nums}
.row .logo{width:40px;height:40px}
.row .ti{font-weight:600}
.row .by{font-size:13px;color:var(--muted)}
.row .wh{font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.warn{background:var(--gold-soft);color:var(--gold)}
.row a{color:var(--accent);font-size:13px;font-weight:600;text-decoration:none}
.row a:hover{text-decoration:underline}
.empty{color:var(--muted);padding:16px 0}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:min(460px,calc(100vw - 32px));padding:0}
dialog::backdrop{background:rgb(0 0 0 / .35)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:10px}
.dlg .hdr{display:flex;gap:12px;align-items:center}
.dlg .hdr .logo{width:48px;height:48px}
.dlg h4{font-family:var(--display);font-weight:400;font-size:21px;margin:0;line-height:1.2}
.dlg dl{display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 10px;margin:0;font-size:14px}
.dlg dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
.dlg dd{margin:0}
.dlg .acts{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.dlg a{color:var(--accent);font-weight:600;text-decoration:none}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}

.note{font-size:13px;color:var(--muted);border-left:3px solid var(--gold);padding:4px 0 4px 12px;max-width:80ch}

@media (max-width:760px){
  .day{min-height:74px;padding:4px}
  .ev span,.ev .t{display:none}
  .ev{justify-content:center;padding:3px;border-left-width:0;border-bottom:3px solid var(--cat)}
  .brklbl{display:none}
  .row{grid-template-columns:40px minmax(0,1fr)}
  .row .tm{grid-column:2;padding-top:0;order:-1}
  .row .logo{grid-row:span 2}
}
@media (prefers-reduced-motion:no-preference){.org,.chip,.ev{transition:border-color .15s,background .15s}}

.months{display:flex;flex-direction:column;gap:28px}
.month h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 10px}
/* embed mode (?embed=1): calendar grid only */
html.embed,html.embed body{background:transparent}
html.embed .top,html.embed section[aria-labelledby="orgs-h"],html.embed section[aria-labelledby="ag-h"],html.embed .note,html.embed section[aria-labelledby="cal-h"]>.sechead{display:none}
html.embed .wrap{padding-block:2px 8px;max-width:none}
html.embed dialog{margin:0 auto}
</style>
</head>

      cell.innerHTML=`<div class="n"><b>${d.getDate()}</b>${br?`<span class="brklbl">${esc(br.label)}</span>`:""}</div>`;
      const evs=EV.filter(e=>days(e).includes(s)&&visible(e)).sort((a,b)=>a.sort-b.sort);
      for(const e of evs){
        const o=ORGFOR(e.orgs[0]); const b=document.createElement("button"); b.type="button"; b.className="ev"+(e.flags?" flag":""); b.style.setProperty("--cat",catVar(o.c));
        b.innerHTML=`${logo(o.h,"mini")}<span>${e.time?`<em class="t">${esc(e.time)}</em>`:""}${esc(e.title)}</span>`;
        b.setAttribute("aria-label",`${e.title}, ${o.n}, ${s}`);
        b.onclick=()=>openEv(e); cell.appendChild(b);
      }
      g.appendChild(cell);
    }
    wrap.appendChild(sec);
  }
}
function renderAgenda(){
  const a=document.getElementById("agenda"); a.innerHTML="";
  const ds=[...new Set(EV.map(e=>e.date))].sort(); let total=0;
  for(const s of ds){
    const evs=EV.filter(e=>e.date===s&&visible(e)).sort((x,y)=>x.sort-y.sort); if(!evs.length) continue; total+=evs.length;
    const label=pd(s).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
    const sec=document.createElement("div"); sec.className="aday";
    sec.innerHTML=`<h3>${label}${s===TODAY?" <em>today</em>":""}</h3>`;
    for(const e of evs){
      const o=ORGFOR(e.orgs[0]); const by=e.orgs.map(h=>ORGFOR(h).n).join(" × ");
      const tags=(e.flags||[]).map(f=>`<span class="tag warn">${FLAGS[f]||f}</span>`).join("")+`<span class="tag" style="background:color-mix(in srgb,${catVar(o.c)} 14%,var(--surface));color:${catVar(o.c)}">${(CATS[o.c]||CATS.faith).n}</span>`;
      const row=document.createElement("div"); row.className="row";
      row.innerHTML=`<div class="tm">${esc(e.time||"Time TBA")}</div>${logo(o.h)}<div style="min-width:0"><div class="ti">${esc(e.title)}</div><div class="by">${esc(by)}</div><div class="wh">${esc(e.where)}${e.notes?" · "+esc(e.notes):""}</div><div class="tags">${tags}${e.url?` <a href="${esc(e.url)}" target="_blank" rel="noopener">View post ↗</a>`:""}</div></div>`;
      sec.appendChild(row);
    }
    a.appendChild(sec);
  }
  if(!total) a.innerHTML='<p class="empty">No events match these filters. Clear the org filter or turn the tags back on.</p>';
  document.getElementById("ag-sum").textContent=`${total} event${total===1?"":"s"} shown`;
}
function openEv(e){
  const o=ORGFOR(e.orgs[0]);
  const when=pd(e.date).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  document.getElementById("dlgbody").innerHTML=`<div class="hdr">${logo(o.h)}<div><h4>${esc(e.title)}</h4><div style="color:var(--muted);font-size:13px">${esc(e.orgs.map(h=>ORGFOR(h).n).join(" × "))}</div></div></div>
   <dl><dt>When</dt><dd>${when}${e.time?", "+esc(e.time):""}</dd><dt>Where</dt><dd>${esc(e.where)}</dd>${e.notes?`<dt>Notes</dt><dd>${esc(e.notes)}</dd>`:""}${e.flags?`<dt>Flag</dt><dd>${e.flags.map(f=>FLAGS[f]||f).join(", ")}</dd>`:""}</dl>
   <div class="acts">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">Open source post ↗</a>`:"<span></span>"}<button class="btn" type="button" id="dlgclose">Close</button></div>`;
  const dlg=document.getElementById("dlg"); dlg.showModal(); if(EMBED){dlg.style.top=Math.max(8,Math.min(lastY-120,innerHeight-dlg.offsetHeight-8))+"px";} document.getElementById("dlgclose").onclick=()=>dlg.close();
}
document.getElementById("dlg").addEventListener("click",ev=>{if(ev.target.id==="dlg") ev.target.close();});
function render(){renderMeta();renderOrgs();renderFilters();renderMonths();renderAgenda();}
render();
if(EMBED && parent!==window){
  const wrap=document.querySelector(".wrap");
  const post=()=>parent.postMessage({type:"utdcal-height",height:Math.ceil(wrap.getBoundingClientRect().height)},"*");
  new ResizeObserver(post).observe(wrap); addEventListener("load",post); post();
}
</script>

</body>
